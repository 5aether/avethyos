---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 9 * * *'
      timezone: 'Europe/Rome'
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push ${{ matrix.variant }} image
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, nvidia]
    env:
      IMAGE_VARIANT: ${{ matrix.variant }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Check desktop installation and user migration
        run: python3 -m unittest discover -s tests -v

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          if [[ "$IMAGE_VARIANT" == nvidia ]]; then
            DEFAULT_TAG=$(just generate-nvidia-tag)
          else
            DEFAULT_TAG=$(just generate-default-tag)
          fi

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # This actually builds the container image
      - name: Build Image
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG} \
            ${IMAGE_VARIANT}

      - name: Check installed desktop
        run: |
          podman run --rm --pull=never --network=none \
            --volume "${PWD}/build_files/check-desktop.sh:/check-desktop.sh:ro" \
            --entrypoint /bin/bash \
            "${IMAGE_NAME}:${DEFAULT_TAG}" /check-desktop.sh

      - name: Rechunk image for smaller updates
        run: |
          just rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG} \
                        ${IMAGE_VARIANT})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          previous_manifest="${RUNNER_TEMP}/previous-${IMAGE_VARIANT}.manifest.json"
          previous_available=false
          if skopeo inspect --raw --retry-times=3 \
            "docker://${image_ref}:${DEFAULT_TAG}" > "$previous_manifest"; then
            previous_available=true
          else
            echo 'Previous image manifest unavailable; update size cannot be estimated.'
            printf '{"layers":[]}\n' > "$previous_manifest"
          fi

          podman push --format=oci --compression-format=zstd --compression-level=19 \
            --force-compression --digestfile=/tmp/digestfile \
            "${IMAGE_NAME}:${DEFAULT_TAG}" "${image_ref}:${DEFAULT_TAG}"
          for tag in ${ALIAS_TAGS}; do
            if [[ "$tag" != "$DEFAULT_TAG" ]]; then
              skopeo copy --preserve-digests --retry-times=3 \
                "docker://${image_ref}:${DEFAULT_TAG}" "docker://${image_ref}:${tag}"
            fi
          done

          digest=$(< /tmp/digestfile)
          echo "digest=${digest}" >> $GITHUB_OUTPUT
          current_manifest="${RUNNER_TEMP}/current-${IMAGE_VARIANT}.manifest.json"
          skopeo inspect --raw --retry-times=3 "docker://${image_ref}@${digest}" > "$current_manifest"
          download_bytes=$(jq '[.layers[].size] | add // 0' "$current_manifest")
          download_size=$(numfmt --to=iec-i --suffix=B "$download_bytes")
          echo "${IMAGE_VARIANT}: ${download_size} of compressed image layers" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$previous_available" == true ]]; then
            update_stats=$(jq -r --slurpfile previous "$previous_manifest" '
              ($previous[0].layers | map(.digest)) as $old_layers
              | [.layers[] | select(.digest as $digest | $old_layers | index($digest) | not)] as $changed
              | [($changed | map(.size) | add // 0), ($changed | length), (.layers | length)]
              | @tsv
            ' "$current_manifest")
            read -r update_bytes changed_layers total_layers <<< "$update_stats"
            update_size=$(numfmt --to=iec-i --suffix=B "$update_bytes")
            echo "Estimated update from the previous ${DEFAULT_TAG}: ${update_size} (${changed_layers}/${total_layers} layers changed)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Estimated update size unavailable: no previous image manifest.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}

