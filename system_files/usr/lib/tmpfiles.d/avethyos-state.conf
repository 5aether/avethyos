# Required desktop state must also exist when this image upgrades an older OS.
# These package-owned directories lack upstream tmpfiles declarations.
d /var/lib/AccountsService 0775 root root - -
d /var/lib/AccountsService/icons 0775 root root - -
d /var/lib/AccountsService/users 0700 root root - -
d /var/lib/alsa 0755 root root - -
d /var/lib/color 0755 root root - -
d /var/lib/color/icc 0755 root root - -
d /var/lib/flatpak 0755 root root - -
d /var/lib/geoclue 0755 geoclue geoclue - -
d /var/spool/cups 0710 root lp - -

# C copies only when the destination is absent, preserving local authselect
# choices and its checksum when this image is upgraded or rolled back.
C /var/lib/authselect/checksum 0644 root root - /usr/share/factory/var/lib/authselect/checksum
